services:
  fitness-tracker:
    build: .
    container_name: fitness-tracker
    restart: unless-stopped
    ports:
      - "8080:5000"
    volumes:
      - /volume1/docker/fitness-tracker/data:/data
    environment:
      - PERSON_A_NAME=${PERSON_A_NAME:-user1}
      - PERSON_B_NAME=${PERSON_B_NAME:-user2}
      - DB_PATH=/data/fitness.db
